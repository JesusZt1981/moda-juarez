name: Admin catalog controls

on:
  push:
    branches: [main]
    paths:
      - 'admin-catalog-controls.js'
      - 'marketing-studio.js'
      - '.github/workflows/admin-catalog-controls.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate admin catalog script syntax
        run: node --check admin-catalog-controls.js
      - name: Validate loader syntax
        run: node --check marketing-studio.js
