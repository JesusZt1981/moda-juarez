name: WOMAN 656 Meta report link

on:
  push:
    branches: [main]
    paths:
      - '.github/scripts/meta_report_link_patch.py'
      - '.github/workflows/meta-report-link.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add Meta report link
        run: python .github/scripts/meta_report_link_patch.py
      - name: Validate
        run: |
          grep -q 'W656_META_REPORT_LINK_V1' estadisticas.html
          git diff --check
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add estadisticas.html
          git commit -m 'Link full Meta Ads report [skip ci]'
          git push
