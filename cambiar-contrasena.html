<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cambiar contraseña · WOMAN 656</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>:root{--bg:#f6f4ef;--card:#fff;--text:#303638;--muted:#6d7474;--border:#d9dfdc;--main:#73877a;--soft:#eef2ef;--danger:#9b4f4f;--good:#527160}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,sans-serif;color:var(--text)}.wrap{width:min(560px,94vw);margin:40px auto}.top a{color:var(--main);font-weight:800;text-decoration:none}.card{margin-top:16px;background:#fff;border:1px solid var(--border);border-radius:18px;padding:24px;box-shadow:0 10px 30px rgba(44,52,52,.08)}.field{display:flex;flex-direction:column;gap:6px;margin:12px 0}.field input{height:44px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;font:inherit}.btn{border:0;border-radius:10px;padding:12px 15px;background:var(--main);color:#fff;font-weight:800;cursor:pointer}.status{margin-top:12px;color:var(--muted)}.error{color:var(--danger)}.ok{color:var(--good)}</style></head><body><div class="wrap"><div class="top"><a href="cuenta.html">← Volver a mi cuenta</a></div><section class="card"><h1>Cambiar contraseña</h1><p>Si soporte te proporcionó una contraseña temporal, cámbiala ahora por una contraseña que solo tú conozcas.</p><label class="field"><span>Nueva contraseña</span><input id="p1" type="password" autocomplete="new-password" minlength="8"></label><label class="field"><span>Confirmar nueva contraseña</span><input id="p2" type="password" autocomplete="new-password" minlength="8"></label><button class="btn" id="save">Guardar nueva contraseña</button><div id="status" class="status">Comprobando sesión…</div></section></div><script>const SUPABASE_URL='https://snkuvxpddxcmbfhgabbx.supabase.co';const SUPABASE_KEY='sb_publishable_z2Z7BluzsEpaqPxyYWTxjg_kkcme7xK';const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'woman656-customer-auth-token-v1'}});const $=id=>document.getElementById(id);async function check(){const {data:{session}}=await sb.auth.getSession();if(!session?.user){$('status').textContent='Primero inicia sesión en tu cuenta WOMAN 656.';$('status').className='status error';$('save').disabled=true;return}$('status').textContent=`Sesión: ${session.user.email||'cuenta social'}`}$('save').onclick=async()=>{const a=$('p1').value,b=$('p2').value;if(a.length<8){$('status').textContent='La nueva contraseña debe tener al menos 8 caracteres.';$('status').className='status error';return}if(a!==b){$('status').textContent='Las contraseñas no coinciden.';$('status').className='status error';return}$('save').disabled=true;const {error}=await sb.auth.updateUser({password:a});if(error){$('status').textContent=error.message;$('status').className='status error';$('save').disabled=false;return}await sb.rpc('clear_my_temporary_password_flag').catch(()=>{});$('status').textContent='Contraseña actualizada correctamente. Ya puedes usarla para tus próximos ingresos.';$('status').className='status ok';setTimeout(()=>location.href='cuenta.html',1200)};check();</script></body></html>
