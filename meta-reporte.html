<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Meta Ads · Informe completo · WOMAN 656</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f6f4ef;--card:#fff;--text:#303638;--muted:#6d7474;--border:#d9dfdc;--blue:#4267b2;--soft:#eef3ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{width:min(1500px,96vw);margin:24px auto}.top{display:flex;justify-content:space-between;gap:14px;align-items:center;flex-wrap:wrap}.top a{color:#526d60;font-weight:800;text-decoration:none}.controls{display:flex;gap:8px;flex-wrap:wrap}.controls select,.controls button{padding:10px 12px;border:1px solid var(--border);border-radius:9px;background:#fff;font-weight:800}.controls button{background:#73877a;color:#fff;border:0}.status,.note{margin:12px 0;padding:11px 13px;border-radius:10px;background:#fff;border:1px solid var(--border);font-size:12px}.note{background:#fff8e8}.kpis{display:grid;grid-template-columns:repeat(8,1fr);gap:10px}.kpi,.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px}.kpi span{font-size:11px;color:var(--muted);font-weight:700}.kpi strong{display:block;font-size:22px;margin-top:5px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}.card{margin-top:12px;overflow:hidden}.card h2{margin:0 0 10px;color:#294f9b}.table-wrap{overflow:auto;max-height:560px}.table{width:100%;border-collapse:collapse;font-size:12px}.table th,.table td{padding:8px;border-bottom:1px solid var(--border);text-align:left;white-space:nowrap}.table th{position:sticky;top:0;background:var(--soft);color:#294f9b}.empty{color:var(--muted);padding:12px}code{font-size:11px}.privacy{font-weight:700}@media(max-width:1100px){.kpis{grid-template-columns:repeat(4,1fr)}}@media(max-width:760px){.grid2{grid-template-columns:1fr}.kpis{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body><div class="wrap">
<div class="top"><div><a href="estadisticas.html">← Estadísticas WOMAN 656</a><h1>Meta Ads · Informe completo</h1></div><div class="controls"><select id="days"><option value="1">Hoy</option><option value="7">7 días</option><option value="30" selected>30 días</option><option value="90">90 días</option></select><button id="refresh">Actualizar Meta</button><button id="download">Descargar JSON</button></div></div>
<div id="status" class="status">Preparando informe…</div>
<div id="privacy" class="note privacy">Los datos publicitarios de Meta son agregados. Meta Ads Insights no entrega nombres, perfiles, correos, teléfonos ni pronombres de las personas que ven o hacen clic en anuncios.</div>
<section class="kpis" id="kpis"></section>
<div id="report"></div>
</div>
<script>
const SUPABASE_URL='https://snkuvxpddxcmbfhgabbx.supabase.co',SUPABASE_KEY='sb_publishable_z2Z7BluzsEpaqPxyYWTxjg_kkcme7xK',BOT_API='https://bot-moda-juarez.onrender.com';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'woman656-auth-token-v1'}}),$=id=>document.getElementById(id);
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;'),num=v=>Number(v)||0,money=v=>new Intl.NumberFormat('es-MX',{style:'currency',currency:'MXN'}).format(num(v)),pct=v=>`${num(v).toFixed(2)}%`;
let lastReport=null,lastSync=null;
async function ensureAdmin(){const {data:{session}}=await sb.auth.getSession();if(!session?.user){location.href='/?admin=1';return null}const {data:p}=await sb.from('profiles').select('role').eq('id',session.user.id).maybeSingle();if(String(p?.role).toLowerCase()!=='admin')throw new Error('Esta cuenta no tiene permisos ADMIN.');return session}
async function sync(days,session){const r=await fetch(`${BOT_API}/api/admin/meta-ads/sync?days=${days}`,{method:'POST',headers:{Authorization:`Bearer ${session.access_token}`}});let body={};try{body=await r.json()}catch(_){}if(!r.ok)throw new Error(body.detail||`Meta respondió ${r.status}`);return body}
function table(title,rows,columns){const body=(rows||[]).map(r=>`<tr>${columns.map(c=>`<td>${c.format?c.format(r[c.key],r):esc(r[c.key]??'—')}</td>`).join('')}</tr>`).join('');return `<section class="card"><h2>${esc(title)}</h2><div class="table-wrap"><table class="table"><thead><tr>${columns.map(c=>`<th>${esc(c.label)}</th>`).join('')}</tr></thead><tbody>${body||`<tr><td colspan="${columns.length}" class="empty">Sin datos disponibles para este desglose.</td></tr>`}</tbody></table></div></section>`}
function render(r){lastReport=r;const s=r.summary||{};$('privacy').textContent=r.privacy_note||$('privacy').textContent;$('kpis').innerHTML=[['Impresiones',num(s.impressions)],['Alcance',num(s.reach)],['Clics',num(s.clicks)],['Landing views',num(s.landing_page_views)],['Frecuencia',num(s.frequency).toFixed(2)],['CTR',pct(s.ctr)],['CPC',money(s.cpc)],['CPM',money(s.cpm)],['Clics únicos',num(s.unique_clicks)],['Interacciones',num(s.inline_post_engagement)],['Gasto social',money(s.social_spend)],['Recuerdo estimado',num(s.estimated_ad_recallers)]].map(([a,b])=>`<div class="kpi"><span>${a}</span><strong>${b}</strong></div>`).join('');
const common=[{key:'impressions',label:'Impresiones'},{key:'reach',label:'Alcance'},{key:'clicks',label:'Clics'},{key:'landing_page_views',label:'Landing views'},{key:'spend',label:'Gasto',format:v=>money(v)}];
$('report').innerHTML=`
<div class="grid2">${table('Plataformas',r.platforms,[{key:'platform',label:'Plataforma'},...common])}${table('Ubicaciones / placements',r.placements,[{key:'platform',label:'Plataforma'},{key:'position',label:'Ubicación'},...common])}</div>
<div class="grid2">${table('Dispositivos',r.devices,[{key:'kind',label:'Tipo de desglose'},{key:'device',label:'Dispositivo'},{key:'impressions',label:'Impresiones'},{key:'reach',label:'Alcance'},{key:'clicks',label:'Clics'},{key:'spend',label:'Gasto',format:v=>money(v)}])}${table('Regiones',r.regions,[{key:'region',label:'Región'},{key:'impressions',label:'Impresiones'},{key:'reach',label:'Alcance'},{key:'clicks',label:'Clics'},{key:'spend',label:'Gasto',format:v=>money(v)}])}</div>
${table('Países',r.countries,[{key:'country',label:'País'},{key:'impressions',label:'Impresiones'},{key:'reach',label:'Alcance'},{key:'clicks',label:'Clics'},{key:'spend',label:'Gasto',format:v=>money(v)}])}
${table('Edad × género × plataforma',r.age_gender_platform,[{key:'age',label:'Edad'},{key:'gender',label:'Género'},{key:'platform',label:'Plataforma'},{key:'impressions',label:'Impresiones'},{key:'reach',label:'Alcance'},{key:'clicks',label:'Clics'},{key:'spend',label:'Gasto',format:v=>money(v)}])}
${table('Rendimiento por hora',r.hours,[{key:'hour',label:'Hora'},{key:'impressions',label:'Impresiones'},{key:'clicks',label:'Clics'},{key:'spend',label:'Gasto',format:v=>money(v)}])}
${table('Productos de catálogo',r.products,[{key:'product_id',label:'SKU / Product ID'},{key:'impressions',label:'Impresiones'},{key:'reach',label:'Alcance'},{key:'clicks',label:'Clics'},{key:'landing_page_views',label:'Landing views'},{key:'spend',label:'Gasto',format:v=>money(v)}])}
<div class="grid2">${table('Producto × edad',r.product_age,[{key:'age',label:'Edad'},{key:'product_id',label:'SKU'},{key:'impressions',label:'Impresiones'},{key:'clicks',label:'Clics'},{key:'landing_page_views',label:'Landing views'},{key:'spend',label:'Gasto',format:v=>money(v)}])}${table('Producto × género',r.product_gender,[{key:'gender',label:'Género'},{key:'product_id',label:'SKU'},{key:'impressions',label:'Impresiones'},{key:'clicks',label:'Clics'},{key:'landing_page_views',label:'Landing views'},{key:'spend',label:'Gasto',format:v=>money(v)}])}</div>
${table('Acciones registradas por Meta',r.actions,[{key:'action_type',label:'Acción'},{key:'value',label:'Cantidad'}])}
${table('Campañas / conjuntos / anuncios',r.ads,[{key:'campaign_name',label:'Campaña'},{key:'campaign_id',label:'ID campaña'},{key:'adset_name',label:'Conjunto'},{key:'adset_id',label:'ID conjunto'},{key:'ad_name',label:'Anuncio'},{key:'ad_id',label:'ID anuncio'},{key:'impressions',label:'Impresiones'},{key:'reach',label:'Alcance'},{key:'clicks',label:'Clics'},{key:'spend',label:'Gasto',format:v=>money(v)}])}`}
async function load(){try{const session=await ensureAdmin();if(!session)return;const days=Math.min(num($('days').value)||30,90);$('status').textContent='Sincronizando Meta y preparando todos los desgloses disponibles…';lastSync=await sync(days,session);const {data,error}=await sb.rpc('admin_meta_extended',{p_days:days});if(error)throw error;render(data||{});const errs=lastSync?.optional_errors||{};$('status').textContent=`Actualizado · ${lastSync?.rows||0} filas guardadas · ${lastSync?.from||''} a ${lastSync?.to||''}`+(Object.keys(errs).length?` · ${Object.keys(errs).length} combinaciones no admitidas por Meta se omitieron sin afectar las demás.`:'')}catch(e){$('status').textContent=`Error: ${e.message}`}}
$('refresh').onclick=load;$('days').onchange=load;$('download').onclick=()=>{if(!lastReport)return;const blob=new Blob([JSON.stringify({generated_at:new Date().toISOString(),sync:lastSync,report:lastReport},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`woman656-meta-informe-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url)};load();
</script></body></html>
